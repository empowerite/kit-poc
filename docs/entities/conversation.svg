<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 806" width="1200" height="806" role="img" aria-labelledby="title desc">
  <title id="title">Conversation</title>
  <desc id="desc">Entities of the Conversation domain: Subject, Event, Route, Channel, Conversation, and Message, and how an event reaches a channel and a thread.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
    text { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #0f172a; }
    .title { font-size: 24px; font-weight: 700; }
    .intro { font-size: 13.5px; fill: #475569; }
    .h { font-size: 15px; font-weight: 700; }
    .w { font-size: 12.5px; fill: #1e293b; }
    .k { font-size: 11px; font-weight: 700; fill: #64748b; letter-spacing: .06em; }
    .ho { font-size: 12px; fill: #475569; }
    .m { font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 11.5px; fill: #334155; }
    .f { font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 11px; fill: #334155; }
    .lbl { font-size: 11.5px; fill: #475569; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
    .sec { font-size: 12px; font-weight: 700; fill: #475569; letter-spacing: .07em; }
    .edge { stroke: #475569; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .dash { stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="805" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="32" y="22" width="6" height="28" rx="3" fill="#be185d"/>
  <text class="title" x="50" y="45" style="fill:#831843">Conversation</text>
  <text class="intro" x="32" y="72">Where people talk about the work. A conversation is a thread about a subject, whose messages live in one or more services: the comments on an issue or a change in the forge,</text>
  <text class="intro" x="32" y="91">and a thread in Slack. Chat is not part of kit's first version.</text>
  <rect x="32.0" y="521.0" width="1136.0" height="125.0" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="sec" x="48.0" y="545.0">MIRRORED ACROSS TWO SERVICES</text>
  <rect x="32.0" y="662.0" width="1136.0" height="112.0" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="sec" x="48.0" y="686.0">THE COMPANION BOT, WHEN CHAT COMES</text>
<clipPath id="c1"><rect x="32.0" y="122.0" width="236.0" height="159.0" rx="9"/></clipPath>
<rect x="32.0" y="122.0" width="236.0" height="159.0" rx="9" fill="#ffffff"/>
<rect x="32.0" y="122.0" width="236.0" height="30" fill="#f1f5f9" clip-path="url(#c1)"/>
<line x1="32.0" y1="152.0" x2="268.0" y2="152.0" stroke="#64748b" stroke-opacity=".35"/>
<text class="h" x="44.0" y="142.5" style="fill:#334155">Subject</text>
<text class="w" x="44.0" y="176.0">anything kit can name with a</text>
<text class="w" x="44.0" y="193.0">reference: a repository, an issue, a</text>
<text class="w" x="44.0" y="210.0">change, a commit, a run, an artifact,</text>
<text class="w" x="44.0" y="227.0">a release, or a deployment; labels,</text>
<text class="w" x="44.0" y="244.0">conversations, events, and evidence</text>
<text class="w" x="44.0" y="261.0">are all about one</text>
<rect x="32.0" y="122.0" width="236.0" height="159.0" rx="9" fill="none" stroke="#64748b" stroke-width="1.5"/>
<clipPath id="c2"><rect x="332.0" y="122.0" width="236.0" height="159.0" rx="9"/></clipPath>
<rect x="332.0" y="122.0" width="236.0" height="159.0" rx="9" fill="#ffffff"/>
<rect x="332.0" y="122.0" width="236.0" height="30" fill="#fce7f3" clip-path="url(#c2)"/>
<line x1="332.0" y1="152.0" x2="568.0" y2="152.0" stroke="#be185d" stroke-opacity=".35"/>
<text class="h" x="344.0" y="142.5" style="fill:#831843">Event</text>
<text class="w" x="344.0" y="176.0">something about a subject worth</text>
<text class="w" x="344.0" y="193.0">telling: a change ready for review,</text>
<text class="w" x="344.0" y="210.0">a run failed, a release published, a</text>
<text class="w" x="344.0" y="227.0">deployment finished, a waiver about</text>
<text class="w" x="344.0" y="244.0">to lapse</text>
<text class="ho" x="344.0" y="265.0"><tspan class="k">HOLDS</tspan>  kind, subject, actor, time</text>
<rect x="332.0" y="122.0" width="236.0" height="159.0" rx="9" fill="none" stroke="#be185d" stroke-width="1.5"/>
<clipPath id="c3"><rect x="632.0" y="122.0" width="236.0" height="159.0" rx="9"/></clipPath>
<rect x="632.0" y="122.0" width="236.0" height="159.0" rx="9" fill="#ffffff"/>
<rect x="632.0" y="122.0" width="236.0" height="30" fill="#fce7f3" clip-path="url(#c3)"/>
<line x1="632.0" y1="152.0" x2="868.0" y2="152.0" stroke="#be185d" stroke-opacity=".35"/>
<text class="h" x="644.0" y="142.5" style="fill:#831843">Route</text>
<text class="w" x="644.0" y="176.0">which events go to which channel</text>
<text class="ho" x="644.0" y="197.0"><tspan class="k">HOLDS</tspan>  event kinds, labels, reach,</text>
<text class="ho" x="644.0" y="213.0">channel</text>
<rect x="632.0" y="122.0" width="236.0" height="159.0" rx="9" fill="none" stroke="#be185d" stroke-width="1.5"/>
<clipPath id="c4"><rect x="932.0" y="122.0" width="236.0" height="159.0" rx="9"/></clipPath>
<rect x="932.0" y="122.0" width="236.0" height="159.0" rx="9" fill="#ffffff"/>
<rect x="932.0" y="122.0" width="236.0" height="30" fill="#fce7f3" clip-path="url(#c4)"/>
<line x1="932.0" y1="152.0" x2="1168.0" y2="152.0" stroke="#be185d" stroke-opacity=".35"/>
<text class="h" x="944.0" y="142.5" style="fill:#831843">Channel</text>
<text class="w" x="944.0" y="176.0">a place in a chat service that</text>
<text class="w" x="944.0" y="193.0">conversations happen in</text>
<text class="ho" x="944.0" y="214.0"><tspan class="k">HOLDS</tspan>  service, address, the reach</text>
<text class="ho" x="944.0" y="230.0">and subject kinds it takes</text>
<rect x="932.0" y="122.0" width="236.0" height="159.0" rx="9" fill="none" stroke="#be185d" stroke-width="1.5"/>
<clipPath id="c5"><rect x="632.0" y="345.0" width="236.0" height="124.0" rx="9"/></clipPath>
<rect x="632.0" y="345.0" width="236.0" height="124.0" rx="9" fill="#ffffff"/>
<rect x="632.0" y="345.0" width="236.0" height="30" fill="#fce7f3" clip-path="url(#c5)"/>
<line x1="632.0" y1="375.0" x2="868.0" y2="375.0" stroke="#be185d" stroke-opacity=".35"/>
<text class="h" x="644.0" y="365.5" style="fill:#831843">Message</text>
<text class="w" x="644.0" y="399.0">one post in a conversation</text>
<text class="ho" x="644.0" y="420.0"><tspan class="k">HOLDS</tspan>  author, as a person; the</text>
<text class="ho" x="644.0" y="436.0">service it was written in; its mirrors</text>
<rect x="632.0" y="345.0" width="236.0" height="124.0" rx="9" fill="none" stroke="#be185d" stroke-width="1.5"/>
<clipPath id="c6"><rect x="932.0" y="345.0" width="236.0" height="124.0" rx="9"/></clipPath>
<rect x="932.0" y="345.0" width="236.0" height="124.0" rx="9" fill="#ffffff"/>
<rect x="932.0" y="345.0" width="236.0" height="30" fill="#fce7f3" clip-path="url(#c6)"/>
<line x1="932.0" y1="375.0" x2="1168.0" y2="375.0" stroke="#be185d" stroke-opacity=".35"/>
<text class="h" x="944.0" y="365.5" style="fill:#831843">Conversation</text>
<text class="w" x="944.0" y="399.0">a thread about one subject,</text>
<text class="w" x="944.0" y="416.0">mirrored across services</text>
<text class="ho" x="944.0" y="437.0"><tspan class="k">HOLDS</tspan>  subject, the thread in each</text>
<text class="ho" x="944.0" y="453.0">service</text>
<rect x="932.0" y="345.0" width="236.0" height="124.0" rx="9" fill="none" stroke="#be185d" stroke-width="1.5"/>
  <text class="ho" x="48" y="565.0">Either side can answer, and kit carries each message to the other. A conversation's labels are its subject's, held by the forge.</text>
  <rect x="48.0" y="577.0" width="546.0" height="53.0" rx="8" fill="#fff" stroke="#be185d" stroke-width="1.2"/>
  <text class="h" style="font-size:13px;fill:#831843" x="58.0" y="596.0">The forge</text>
  <text class="ho" style="font-size:11.5px" x="58.0" y="612.0">the comments on an issue or a change</text>
  <rect x="606.0" y="577.0" width="546.0" height="53.0" rx="8" fill="#fff" stroke="#be185d" stroke-width="1.2"/>
  <text class="h" style="font-size:13px;fill:#831843" x="616.0" y="596.0">Slack</text>
  <text class="ho" style="font-size:11.5px" x="616.0" y="612.0">a thread in a channel, holding the subject in its message metadata</text>
  <circle cx="54" cy="706.0" r="2.2" fill="#be185d"/>
  <text class="w" x="66" y="710.0">A Slack app, released apart from kit, that a team adds to its channels; it is the listener that two-way threads need.</text>
  <circle cx="54" cy="728.0" r="2.2" fill="#be185d"/>
  <text class="w" x="66" y="732.0">It answers questions about the work, carries messages between a thread and the forge's comments, promotes a thread to an issue, and posts routed events.</text>
  <circle cx="54" cy="750.0" r="2.2" fill="#be185d"/>
  <text class="w" x="66" y="754.0">It reaches kit only through kit serve, acts for the person who asked, holds no evidence, and signs nothing: what it reports is a finding.</text>
  <path class="edge" d="M 332.0 137.0 H 268.0"/>
  <text class="lbl" text-anchor="middle" x="300.0" y="130.0">about</text>
  <path class="edge" d="M 568.0 137.0 H 632.0"/>
  <text class="lbl" text-anchor="middle" x="600.0" y="130.0">goes by</text>
  <path class="edge" d="M 868.0 137.0 H 932.0"/>
  <text class="lbl" text-anchor="middle" x="900.0" y="130.0">sends to</text>
  <path class="edge" d="M 1050.0 281.0 V 345.0"/>
  <text class="lbl" x="1058.0" y="317.0">holds</text>
  <path class="edge" d="M 868.0 360.0 H 932.0"/>
  <text class="lbl" text-anchor="middle" x="900.0" y="353.0">posted in</text>
  <path class="edge dash" d="M 450.0 281.0 L 450.0 497.0 L 1050.0 497.0 L 1050.0 469.0"/>
  <text class="lbl" text-anchor="middle" x="750.0" y="490.0">lands in the subject's thread, or starts one</text>
</svg>
