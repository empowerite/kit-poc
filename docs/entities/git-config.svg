  <text class="h" x="510.6" y="123.5" style="fill:#713f12">GitConfigEntry</text>
  <text class="w" x="510.6" y="157">One key and its value in a</text>
  <text class="w" x="510.6" y="174">configuration file or on a command</text>
  <text class="w" x="510.6" y="191">line, with its scope and where it</text>
  <text class="w" x="510.6" y="208">came from.</text>
  <text class="ho" x="510.6" y="230">native: git</text>
  <text class="ho" x="510.6" y="252">0 held, 0 planned, 9 unused</text>
