  <text class="h" x="510.6" y="401.5" style="fill:#713f12">GitBranchConfig</text>
  <text class="w" x="510.6" y="435">What git fetches, merges, rebases,</text>
  <text class="w" x="510.6" y="452">and pushes for one local branch,</text>
  <text class="w" x="510.6" y="469">and what the branch is for.</text>
  <text class="ho" x="510.6" y="491">native: git</text>
  <text class="ho" x="510.6" y="513">2 held, 0 planned, 8 unused</text>
