  <path d="M 32 411 V 390 A 9 9 0 0 1 41 381 H 259 A 9 9 0 0 1 268 390 V 411 Z" fill="#fef9c3"/>
  <line x1="32" y1="411" x2="268" y2="411" stroke="#a16207" stroke-opacity=".35"/>
  <text class="h" x="44" y="401.5" style="fill:#713f12">GitUserConfig</text>
  <text class="w" x="44" y="435">Who git writes as the author and</text>
  <text class="w" x="44" y="452">committer, and how it signs.</text>
  <text class="ho" x="44" y="474">native: git</text>
  <text class="ho" x="44" y="496">0 held, 3 planned, 16 unused</text>
