  <text class="h" x="990.7" y="123.5" style="fill:#713f12">GitRefspec</text>
  <text class="w" x="990.7" y="157">A rule that maps refs of one</text>
  <text class="w" x="990.7" y="174">repository to refs of another, for a</text>
  <text class="w" x="990.7" y="191">fetch or a push.</text>
  <text class="ho" x="990.7" y="213">native: git</text>
  <text class="ho" x="990.7" y="235">0 held, 0 planned, 6 unused</text>
  <line x1="990.7" y1="267" x2="1202.7" y2="267" stroke="#e2e8f0"/>
  <circle cx="997.7" cy="277.5" r="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="f" x="1008.7" y="281">not held yet</text>
  <rect x="978.7" y="103" width="236" height="198" rx="9" fill="none" stroke="#a16207" stroke-width="1.5"/>
  <rect x="978.7" y="381" width="236" height="181" rx="9" fill="#ffffff"/>
  <path d="M 978.7 411 V 390 A 9 9 0 0 1 987.7 381 H 1205.7 A 9 9 0 0 1 1214.7 390 V 411 Z" fill="#fef9c3"/>
  <line x1="978.7" y1="411" x2="1214.7" y2="411" stroke="#a16207" stroke-opacity=".35"/>
  <text class="h" x="990.7" y="401.5" style="fill:#713f12">GitRemoteConfig</text>
  <text class="w" x="990.7" y="435">A named repository this one fetches</text>
  <text class="w" x="990.7" y="452">from and pushes to, with its URLs,</text>
  <text class="w" x="990.7" y="469">its refspecs, and how to fetch.</text>
  <text class="ho" x="990.7" y="491">native: git</text>
  <text class="ho" x="990.7" y="513">4 held, 0 planned, 21 unused</text>
  <line x1="990.7" y1="528" x2="1202.7" y2="528" stroke="#e2e8f0"/>
  <circle cx="997.7" cy="538.5" r="4.5" fill="#16a34a"/>
  <text class="f" x="1008.7" y="542">kit workspace</text>
  <rect x="978.7" y="381" width="236" height="181" rx="9" fill="none" stroke="#a16207" stroke-width="1.5"/>
