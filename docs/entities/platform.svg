  <line x1="48" y1="573.5" x2="1232.0" y2="573.5" stroke="#e2e8f0"/>
  <text class="ho" x="48" y="593.5">The forge seam fills hosting, review, ci, and releases together. Planning folds into tracking: an iteration is a field of an issue and an entity of its tracker.</text>
  <circle cx="54" cy="677.5" r="2.2" fill="#0369a1"/>
  <text class="w" x="66" y="681.5">A capability bound to no service is absent, and a verb that needs it says which capability is missing.</text>
  <circle cx="54" cy="699.5" r="2.2" fill="#0369a1"/>
  <text class="w" x="66" y="703.5">Bindings are inferred first; the existing keys forge, forges, and trackers stay as the short form.</text>
  <circle cx="54" cy="721.5" r="2.2" fill="#0369a1"/>
  <text class="w" x="66" y="725.5">kit platform lists each capability, the service filling it, whether that was inferred or set, and whether the service's CLI is signed in.</text>
  <path class="edge" d="M 282.0 137.0 H 354.0"/>
  <text class="lbl" text-anchor="middle" x="318.0" y="130.0">speaks to</text>
  <path class="edge" d="M 604.0 137.0 H 676.0"/>
  <text class="lbl" text-anchor="middle" x="640.0" y="130.0">fills</text>
  <path class="edge" d="M 998.0 137.0 H 926.0"/>
  <text class="lbl" text-anchor="middle" x="962.0" y="130.0">chooses for</text>
</svg>
