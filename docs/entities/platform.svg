<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 778" width="1280" height="778" role="img" aria-labelledby="title desc">
  <title id="title">Platform</title>
  <desc id="desc">Entities of the Platform domain: Service, Capability, Binding, and Provider, and which service fills which capability.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
