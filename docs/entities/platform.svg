  </defs>
  <rect x="0.5" y="0.5" width="1279" height="776" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="32" y="22" width="6" height="28" rx="3" fill="#0369a1"/>
  <text class="title" x="50" y="45" style="fill:#0c4a6e">Platform</text>
  <text class="intro" x="32" y="72">The platform, or the stack, is the set of services a repository's work runs on. A capability is a job a service does, and each capability is a seam; a binding says which service fills it for a</text>
  <text class="intro" x="32" y="91">repository.</text>
  <rect x="32.0" y="286.0" width="1216.0" height="331.5" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="sec" x="48.0" y="310.0">WHAT EACH SERVICE FILLS TODAY; UNDER EACH CAPABILITY, ITS SEAM IN KIT</text>
  <rect x="32.0" y="633.5" width="1216.0" height="112.0" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="sec" x="48.0" y="657.5">RULES</text>
<clipPath id="c1"><rect x="32.0" y="122.0" width="250.0" height="120.0" rx="9"/></clipPath>
<rect x="32.0" y="122.0" width="250.0" height="120.0" rx="9" fill="#ffffff"/>
<rect x="32.0" y="122.0" width="250.0" height="30" fill="#e0f2fe" clip-path="url(#c1)"/>
<line x1="32.0" y1="152.0" x2="282.0" y2="152.0" stroke="#0369a1" stroke-opacity=".35"/>
<text class="h" x="44.0" y="142.5" style="fill:#0c4a6e">Provider</text>
<text class="w" x="44.0" y="176.0">kit's code, or an organization's</text>
<text class="w" x="44.0" y="193.0">command, that speaks to one kind of</text>
<text class="w" x="44.0" y="210.0">service</text>
<rect x="32.0" y="122.0" width="250.0" height="120.0" rx="9" fill="none" stroke="#0369a1" stroke-width="1.5"/>
<clipPath id="c2"><rect x="354.0" y="122.0" width="250.0" height="120.0" rx="9"/></clipPath>
<rect x="354.0" y="122.0" width="250.0" height="120.0" rx="9" fill="#ffffff"/>
<rect x="354.0" y="122.0" width="250.0" height="30" fill="#e0f2fe" clip-path="url(#c2)"/>
<line x1="354.0" y1="152.0" x2="604.0" y2="152.0" stroke="#0369a1" stroke-opacity=".35"/>
<text class="h" x="366.0" y="142.5" style="fill:#0c4a6e">Service</text>
<text class="w" x="366.0" y="176.0">one system kit talks to: github.com, a</text>
<text class="w" x="366.0" y="193.0">self-hosted GitLab, an Azure DevOps</text>
<text class="w" x="366.0" y="210.0">organization, a Slack workspace, a</text>
<text class="w" x="366.0" y="227.0">container registry</text>
<rect x="354.0" y="122.0" width="250.0" height="120.0" rx="9" fill="none" stroke="#0369a1" stroke-width="1.5"/>
<clipPath id="c3"><rect x="676.0" y="122.0" width="250.0" height="120.0" rx="9"/></clipPath>
<rect x="676.0" y="122.0" width="250.0" height="120.0" rx="9" fill="#ffffff"/>
<rect x="676.0" y="122.0" width="250.0" height="30" fill="#e0f2fe" clip-path="url(#c3)"/>
<line x1="676.0" y1="152.0" x2="926.0" y2="152.0" stroke="#0369a1" stroke-opacity=".35"/>
<text class="h" x="688.0" y="142.5" style="fill:#0c4a6e">Capability</text>
<text class="w" x="688.0" y="176.0">a job a service does, and each</text>
<text class="w" x="688.0" y="193.0">capability is a seam: hosting, review,</text>
<text class="w" x="688.0" y="210.0">tracking, ci, cd, releases, artifacts,</text>
<text class="w" x="688.0" y="227.0">evidence, identity, chat</text>
<rect x="676.0" y="122.0" width="250.0" height="120.0" rx="9" fill="none" stroke="#0369a1" stroke-width="1.5"/>
<clipPath id="c4"><rect x="998.0" y="122.0" width="250.0" height="120.0" rx="9"/></clipPath>
<rect x="998.0" y="122.0" width="250.0" height="120.0" rx="9" fill="#ffffff"/>
<rect x="998.0" y="122.0" width="250.0" height="30" fill="#e0f2fe" clip-path="url(#c4)"/>
<line x1="998.0" y1="152.0" x2="1248.0" y2="152.0" stroke="#0369a1" stroke-opacity=".35"/>
<text class="h" x="1010.0" y="142.5" style="fill:#0c4a6e">Binding</text>
<text class="w" x="1010.0" y="176.0">which service fills a capability for a</text>
<text class="w" x="1010.0" y="193.0">repository; inferred from the primary</text>
<text class="w" x="1010.0" y="210.0">remote's host, overridden only where</text>
<text class="w" x="1010.0" y="227.0">it differs</text>
