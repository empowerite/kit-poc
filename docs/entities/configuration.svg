<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 881" width="1200" height="881" role="img" aria-labelledby="title desc">
  <title id="title">Configuration</title>
  <desc id="desc">Entities of the Configuration domain: Owner, Reach, Selection, Setting, Preference, Answer, and Local state, shown as the grid of who decides a value for which repositories.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
    text { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #0f172a; }
    .title { font-size: 24px; font-weight: 700; }
    .intro { font-size: 13.5px; fill: #475569; }
    .h { font-size: 15px; font-weight: 700; }
    .w { font-size: 12.5px; fill: #1e293b; }
    .k { font-size: 11px; font-weight: 700; fill: #64748b; letter-spacing: .06em; }
    .ho { font-size: 12px; fill: #475569; }
    .m { font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 11.5px; fill: #334155; }
    .f { font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 11px; fill: #334155; }
    .lbl { font-size: 11.5px; fill: #475569; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
    .sec { font-size: 12px; font-weight: 700; fill: #475569; letter-spacing: .07em; }
    .edge { stroke: #475569; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .dash { stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="880" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="32" y="22" width="6" height="28" rx="3" fill="#4338ca"/>
  <text class="title" x="50" y="45" style="fill:#312e81">Configuration</text>
  <text class="intro" x="32" y="72">Who decides what, for which repositories. A value has an owner, who decides it, and a reach, the repositories it applies to.</text>
  <rect x="32.0" y="103.0" width="1136.0" height="276.0" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="sec" x="48.0" y="127.0">OWNER × REACH</text>
  <rect x="32.0" y="759.0" width="1136.0" height="90.0" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="sec" x="48.0" y="783.0">RULES</text>
<clipPath id="c1"><rect x="322.0" y="431.0" width="556.0" height="91.0" rx="9"/></clipPath>
<rect x="322.0" y="431.0" width="556.0" height="91.0" rx="9" fill="#ffffff"/>
<rect x="322.0" y="431.0" width="556.0" height="30" fill="#e0e7ff" clip-path="url(#c1)"/>
<line x1="322.0" y1="461.0" x2="878.0" y2="461.0" stroke="#4338ca" stroke-opacity=".35"/>
<text class="h" x="334.0" y="451.5" style="fill:#312e81">Selection</text>
<text class="w" x="334.0" y="485.0">a workspace by name, or a selector: an owner, a topic, a name pattern</text>
<text class="ho" x="334.0" y="506.0"><tspan class="k">HOLDS</tspan>  what “selected” means; the workspace file keeps holding only membership</text>
<rect x="322.0" y="431.0" width="556.0" height="91.0" rx="9" fill="none" stroke="#4338ca" stroke-width="1.5"/>
<clipPath id="c2"><rect x="32.0" y="566.0" width="266.0" height="157.0" rx="9"/></clipPath>
<rect x="32.0" y="566.0" width="266.0" height="157.0" rx="9" fill="#ffffff"/>
<rect x="32.0" y="566.0" width="266.0" height="30" fill="#e0e7ff" clip-path="url(#c2)"/>
<line x1="32.0" y1="596.0" x2="298.0" y2="596.0" stroke="#4338ca" stroke-opacity=".35"/>
<text class="h" x="44.0" y="586.5" style="fill:#312e81">Setting</text>
<text class="w" x="44.0" y="620.0">decides what kit enforces or what a</text>
<text class="w" x="44.0" y="637.0">verdict is</text>
<text class="ho" x="44.0" y="658.0"><tspan class="k">HOLDS</tspan>  comes only from the repository and</text>
<text class="ho" x="44.0" y="674.0">the organization; a repository can tighten</text>
<text class="ho" x="44.0" y="690.0">an organization's setting, never loosen it</text>
<rect x="32.0" y="566.0" width="266.0" height="157.0" rx="9" fill="none" stroke="#4338ca" stroke-width="1.5"/>
<clipPath id="c3"><rect x="322.0" y="566.0" width="266.0" height="157.0" rx="9"/></clipPath>
<rect x="322.0" y="566.0" width="266.0" height="157.0" rx="9" fill="#ffffff"/>
<rect x="322.0" y="566.0" width="266.0" height="30" fill="#e0e7ff" clip-path="url(#c3)"/>
<line x1="322.0" y1="596.0" x2="588.0" y2="596.0" stroke="#4338ca" stroke-opacity=".35"/>
<text class="h" x="334.0" y="586.5" style="fill:#312e81">Preference</text>
<text class="w" x="334.0" y="620.0">decides what a person sees or which</text>
<text class="w" x="334.0" y="637.0">default they get</text>
<text class="ho" x="334.0" y="658.0"><tspan class="k">HOLDS</tspan>  any owner may set it; the narrower</text>
<text class="ho" x="334.0" y="674.0">reach wins, then person over repository</text>
<text class="ho" x="334.0" y="690.0">over organization</text>
<rect x="322.0" y="566.0" width="266.0" height="157.0" rx="9" fill="none" stroke="#4338ca" stroke-width="1.5"/>
<clipPath id="c4"><rect x="612.0" y="566.0" width="266.0" height="157.0" rx="9"/></clipPath>
<rect x="612.0" y="566.0" width="266.0" height="157.0" rx="9" fill="#ffffff"/>
<rect x="612.0" y="566.0" width="266.0" height="30" fill="#e0e7ff" clip-path="url(#c4)"/>
<line x1="612.0" y1="596.0" x2="878.0" y2="596.0" stroke="#4338ca" stroke-opacity=".35"/>
<text class="h" x="624.0" y="586.5" style="fill:#312e81">Answer</text>
<text class="w" x="624.0" y="620.0">a value a package's templates use, and a</text>
<text class="w" x="624.0" y="637.0">setting</text>
<rect x="612.0" y="566.0" width="266.0" height="157.0" rx="9" fill="none" stroke="#4338ca" stroke-width="1.5"/>
<clipPath id="c5"><rect x="902.0" y="566.0" width="266.0" height="157.0" rx="9"/></clipPath>
<rect x="902.0" y="566.0" width="266.0" height="157.0" rx="9" fill="#ffffff"/>
<rect x="902.0" y="566.0" width="266.0" height="30" fill="#e0e7ff" clip-path="url(#c5)"/>
<line x1="902.0" y1="596.0" x2="1168.0" y2="596.0" stroke="#4338ca" stroke-opacity=".35"/>
<text class="h" x="914.0" y="586.5" style="fill:#312e81">Local state</text>
<text class="w" x="914.0" y="620.0">a clone's or a worktree's toolchain</text>
<text class="w" x="914.0" y="637.0">choice, caches, logs, and the last</text>
<text class="w" x="914.0" y="654.0">workspace used</text>
<text class="ho" x="914.0" y="675.0"><tspan class="k">HOLDS</tspan>  stays in the git directory,</text>
<text class="ho" x="914.0" y="691.0">~/.cache/kit/, and .kit/logs/; nothing reads it</text>
<text class="ho" x="914.0" y="707.0">as a decision</text>
<rect x="902.0" y="566.0" width="266.0" height="157.0" rx="9" fill="none" stroke="#4338ca" stroke-width="1.5"/>
  <rect x="182.0" y="141" width="316.7" height="30" rx="8" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.2"/>
  <text class="h" text-anchor="middle" style="fill:#312e81" x="340.3" y="161">Reach: all</text>
  <rect x="506.7" y="141" width="316.7" height="30" rx="8" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.2"/>
  <text class="h" text-anchor="middle" style="fill:#312e81" x="665.0" y="161">Reach: selected</text>
  <rect x="831.3" y="141" width="316.7" height="30" rx="8" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.2"/>
  <text class="h" text-anchor="middle" style="fill:#312e81" x="989.7" y="161">Reach: one repository</text>
  <rect x="48" y="179" width="126" height="54" rx="8" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.2"/>
  <text class="k" x="58" y="201">OWNER</text>
  <text class="h" style="fill:#312e81" x="58" y="219">organization</text>
  <rect x="182.0" y="179" width="316.7" height="54" rx="8" fill="#fff" stroke="#4338ca" stroke-width="1.2"/>
  <text class="w" text-anchor="middle" style="fill:#1e293b" x="340.3" y="210.5">a source package</text>
  <rect x="506.7" y="179" width="316.7" height="54" rx="8" fill="#fff" stroke="#4338ca" stroke-width="1.2"/>
  <text class="w" text-anchor="middle" style="fill:#1e293b" x="665.0" y="210.5">a source package, by selector</text>
  <rect x="831.3" y="179" width="316.7" height="54" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text class="w" text-anchor="middle" style="fill:#94a3b8" x="989.7" y="210.5">not used: a repository's own file decides</text>
  <rect x="48" y="241" width="126" height="54" rx="8" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.2"/>
  <text class="k" x="58" y="263">OWNER</text>
  <text class="h" style="fill:#312e81" x="58" y="281">person</text>
  <rect x="182.0" y="241" width="316.7" height="54" rx="8" fill="#fff" stroke="#4338ca" stroke-width="1.2"/>
  <text class="w" text-anchor="middle" style="fill:#1e293b" x="340.3" y="272.5">~/.config/kit/, under all</text>
  <rect x="506.7" y="241" width="316.7" height="54" rx="8" fill="#fff" stroke="#4338ca" stroke-width="1.2"/>
  <text class="w" text-anchor="middle" style="fill:#1e293b" x="665.0" y="272.5">~/.config/kit/, under a selection</text>
  <rect x="831.3" y="241" width="316.7" height="54" rx="8" fill="#fff" stroke="#4338ca" stroke-width="1.2"/>
  <text class="w" text-anchor="middle" style="fill:#1e293b" x="989.7" y="264.0">~/.config/kit/, under the repository, never checked</text>
  <text class="w" text-anchor="middle" style="fill:#1e293b" x="989.7" y="281.0">in</text>
  <rect x="48" y="303" width="126" height="54" rx="8" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.2"/>
  <text class="k" x="58" y="325">OWNER</text>
  <text class="h" style="fill:#312e81" x="58" y="343">repository</text>
  <rect x="182.0" y="303" width="316.7" height="54" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text class="w" text-anchor="middle" style="fill:#94a3b8" x="340.3" y="334.5">not used</text>
  <rect x="506.7" y="303" width="316.7" height="54" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text class="w" text-anchor="middle" style="fill:#94a3b8" x="665.0" y="334.5">not used</text>
  <rect x="831.3" y="303" width="316.7" height="54" rx="8" fill="#fff" stroke="#4338ca" stroke-width="1.2"/>
  <text class="w" text-anchor="middle" style="fill:#1e293b" x="989.7" y="334.5">kit.yml and .kit/, checked in with the code: shared</text>
  <circle cx="54" cy="803.0" r="2.2" fill="#4338ca"/>
  <text class="w" x="66" y="807.0">Each key declares in the schema whether it is a setting or a preference, so a misplaced key is refused where it is read.</text>
  <circle cx="54" cy="825.0" r="2.2" fill="#4338ca"/>
  <text class="w" x="66" y="829.0">kit config &lt;key&gt; shows a key's value, which owner and reach it came from, and every other that tried to set it.</text>
  <path class="edge" d="M 665.0 431.0 L 665.0 379.0"/>
  <text class="lbl" text-anchor="start" x="673.0" y="413.0">is what the reach “selected” names</text>
</svg>
