<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 451" width="1200" height="451" role="img" aria-labelledby="title desc">
  <title id="title">Tools</title>
  <desc id="desc">Entities of the Tools domain: Tool, Tool catalog, Toolchain, and Dependency manager, and how a catalog approves what a toolchain installs.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
    text { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #0f172a; }
    .title { font-size: 24px; font-weight: 700; }
    .intro { font-size: 13.5px; fill: #475569; }
    .h { font-size: 15px; font-weight: 700; }
    .w { font-size: 12.5px; fill: #1e293b; }
    .k { font-size: 11px; font-weight: 700; fill: #64748b; letter-spacing: .06em; }
    .ho { font-size: 12px; fill: #475569; }
    .m { font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 11.5px; fill: #334155; }
    .f { font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 11px; fill: #334155; }
    .lbl { font-size: 11.5px; fill: #475569; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
    .sec { font-size: 12px; font-weight: 700; fill: #475569; letter-spacing: .07em; }
    .edge { stroke: #475569; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .dash { stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="450" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="32" y="22" width="6" height="28" rx="3" fill="#475569"/>
  <text class="title" x="50" y="45" style="fill:#1e293b">Tools</text>
  <text class="intro" x="32" y="72">What runs on a desk and in CI. A toolchain installs and pins tools, and a dependency manager pins a language's packages on top; the catalog of approved tools is what is new.</text>
  <g transform="translate(898,30)"><circle cx="5" cy="0" r="4.5" fill="#16a34a"/><text class="ho" x="16" y="3.5" style="font-size:11.5px">in kit today</text><circle cx="112" cy="0" r="4" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><text class="ho" x="123" y="3.5" style="font-size:11.5px">not modelled yet</text></g>
  <rect x="32.0" y="329.0" width="1136.0" height="90.0" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="sec" x="48.0" y="353.0">RULES</text>
<clipPath id="c1"><rect x="32.0" y="103.0" width="221.0" height="190.0" rx="9"/></clipPath>
<rect x="32.0" y="103.0" width="221.0" height="190.0" rx="9" fill="#ffffff"/>
<rect x="32.0" y="103.0" width="221.0" height="30" fill="#f8fafc" clip-path="url(#c1)"/>
<line x1="32.0" y1="133.0" x2="253.0" y2="133.0" stroke="#475569" stroke-opacity=".35"/>
<text class="h" x="44.0" y="123.5" style="fill:#1e293b">Tool catalog</text>
<text class="w" x="44.0" y="157.0">the tools an organization</text>
<text class="w" x="44.0" y="174.0">approves</text>
<text class="ho" x="44.0" y="195.0"><tspan class="k">HOLDS</tspan>  for each tool: name, allowed</text>
<text class="ho" x="44.0" y="211.0">versions, where each toolchain</text>
<text class="ho" x="44.0" y="227.0">installs it from, its checksum or</text>
<text class="ho" x="44.0" y="243.0">digest, why it is approved</text>
<line x1="44.0" y1="259.0" x2="241.0" y2="259.0" stroke="#e2e8f0"/>
<circle cx="51.0" cy="269.5" r="4" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
<text class="f" x="62.0" y="273.0">not modelled</text>
<rect x="32.0" y="103.0" width="221.0" height="190.0" rx="9" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 4"/>
<clipPath id="c2"><rect x="337.0" y="103.0" width="221.0" height="190.0" rx="9"/></clipPath>
<rect x="337.0" y="103.0" width="221.0" height="190.0" rx="9" fill="#ffffff"/>
<rect x="337.0" y="103.0" width="221.0" height="30" fill="#e2e8f0" clip-path="url(#c2)"/>
<line x1="337.0" y1="133.0" x2="558.0" y2="133.0" stroke="#475569" stroke-opacity=".35"/>
<text class="h" x="349.0" y="123.5" style="fill:#1e293b">Tool</text>
<text class="w" x="349.0" y="157.0">a program the work runs on a</text>
<text class="w" x="349.0" y="174.0">desk or in CI: gh, jq, opa,</text>
<text class="w" x="349.0" y="191.0">markdownlint-cli2</text>
<text class="ho" x="349.0" y="212.0"><tspan class="k">HOLDS</tspan>  name, version, where it</text>
<text class="ho" x="349.0" y="228.0">resolves</text>
<line x1="349.0" y1="259.0" x2="546.0" y2="259.0" stroke="#e2e8f0"/>
<circle cx="356.0" cy="269.5" r="4.5" fill="#16a34a"/>
<text class="f" x="367.0" y="273.0">kit tools</text>
<rect x="337.0" y="103.0" width="221.0" height="190.0" rx="9" fill="none" stroke="#475569" stroke-width="1.5"/>
<clipPath id="c3"><rect x="642.0" y="103.0" width="221.0" height="190.0" rx="9"/></clipPath>
<rect x="642.0" y="103.0" width="221.0" height="190.0" rx="9" fill="#ffffff"/>
<rect x="642.0" y="103.0" width="221.0" height="30" fill="#e2e8f0" clip-path="url(#c3)"/>
<line x1="642.0" y1="133.0" x2="863.0" y2="133.0" stroke="#475569" stroke-opacity=".35"/>
<text class="h" x="654.0" y="123.5" style="fill:#1e293b">Toolchain</text>
<text class="w" x="654.0" y="157.0">a tool manager: mise, nix,</text>
<text class="w" x="654.0" y="174.0">Homebrew, Docker, a dev</text>
<text class="w" x="654.0" y="191.0">container, or a system package</text>
<text class="w" x="654.0" y="208.0">manager</text>
<text class="ho" x="654.0" y="229.0"><tspan class="k">HOLDS</tspan>  its role, project or system</text>
<line x1="654.0" y1="259.0" x2="851.0" y2="259.0" stroke="#e2e8f0"/>
<circle cx="661.0" cy="269.5" r="4.5" fill="#16a34a"/>
<text class="f" x="672.0" y="273.0">kit toolchains</text>
<rect x="642.0" y="103.0" width="221.0" height="190.0" rx="9" fill="none" stroke="#475569" stroke-width="1.5"/>
<clipPath id="c4"><rect x="947.0" y="103.0" width="221.0" height="190.0" rx="9"/></clipPath>
<rect x="947.0" y="103.0" width="221.0" height="190.0" rx="9" fill="#ffffff"/>
<rect x="947.0" y="103.0" width="221.0" height="30" fill="#e2e8f0" clip-path="url(#c4)"/>
<line x1="947.0" y1="133.0" x2="1168.0" y2="133.0" stroke="#475569" stroke-opacity=".35"/>
<text class="h" x="959.0" y="123.5" style="fill:#1e293b">Dependency manager</text>
<text class="w" x="959.0" y="157.0">npm or uv, pinning packages</text>
<text class="w" x="959.0" y="174.0">from a lock file</text>
<text class="ho" x="959.0" y="195.0"><tspan class="k">HOLDS</tspan>  its manifest and lock</text>
<line x1="959.0" y1="245.0" x2="1156.0" y2="245.0" stroke="#e2e8f0"/>
<circle cx="966.0" cy="255.5" r="4.5" fill="#16a34a"/>
<text class="f" x="977.0" y="259.0">kit tools · the</text>
<text class="f" x="977.0" y="273.0">dependencies seam</text>
<rect x="947.0" y="103.0" width="221.0" height="190.0" rx="9" fill="none" stroke="#475569" stroke-width="1.5"/>
  <circle cx="54" cy="373.0" r="2.2" fill="#475569"/>
  <text class="w" x="66" y="377.0">A catalog is a shared setting, delivered as a source package pinned by digest, and reaches repositories by selector: all of an organization's, or a selection.</text>
  <circle cx="54" cy="395.0" r="2.2" fill="#475569"/>
  <text class="w" x="66" y="399.0">kit tools install installs what the chosen toolchain pins. With a catalog, kit check also reports a pinned tool the catalog does not approve, or a version outside its range.</text>
  <path class="edge" d="M 253.0 118.0 H 337.0"/>
  <text class="lbl" text-anchor="middle" x="295.0" y="111.0">approves</text>
  <path class="edge" d="M 642.0 118.0 H 558.0"/>
  <text class="lbl" text-anchor="middle" x="600.0" y="111.0">installs</text>
  <path class="edge" d="M 947.0 118.0 H 863.0"/>
  <text class="lbl" text-anchor="middle" x="905.0" y="111.0">runs on</text>
</svg>
