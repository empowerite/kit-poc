  <path class="edge" d="M 865.0 354.0 H 941.0"/>
  <text class="lbl" text-anchor="middle" x="903.0" y="347.0">kept in</text>
  <path class="edge" d="M 751.5 497.0 V 561.0"/>
  <text class="lbl" x="759.5" y="533.0">deployed as</text>
  <path class="edge" d="M 638.0 576.0 H 562.0"/>
  <text class="lbl" text-anchor="middle" x="600.0" y="569.0">to</text>
  <path class="edge" d="M 335.0 576.0 H 259.0"/>
  <text class="lbl" text-anchor="middle" x="297.0" y="569.0">runs on</text>
  <path class="edge" d="M 448.5 817.0 V 753.0"/>
  <text class="lbl" x="456.5" y="789.0">groups the targets of</text>
