<line x1="32.0" y1="133.0" x2="259.0" y2="133.0" stroke="#be123c" stroke-opacity=".35"/>
<text class="h" x="44.0" y="123.5" style="fill:#881337">Gate</text>
<text class="w" x="44.0" y="157.0">the repository's own CI command</text>
<text class="ho" x="44.0" y="178.0"><tspan class="k">HOLDS</tspan>  the gate setting</text>
<line x1="44.0" y1="241.0" x2="247.0" y2="241.0" stroke="#e2e8f0"/>
<circle cx="51.0" cy="251.5" r="4.5" fill="#16a34a"/>
<text class="f" x="62.0" y="255.0">kit gate</text>
<rect x="32.0" y="103.0" width="227.0" height="172.0" rx="9" fill="none" stroke="#be123c" stroke-width="1.5"/>
<clipPath id="c2"><rect x="335.0" y="103.0" width="227.0" height="172.0" rx="9"/></clipPath>
<rect x="335.0" y="103.0" width="227.0" height="172.0" rx="9" fill="#ffffff"/>
<rect x="335.0" y="103.0" width="227.0" height="30" fill="#ffe4e6" clip-path="url(#c2)"/>
<line x1="335.0" y1="133.0" x2="562.0" y2="133.0" stroke="#be123c" stroke-opacity=".35"/>
<text class="h" x="347.0" y="123.5" style="fill:#881337">Pipeline</text>
<text class="w" x="347.0" y="157.0">a CI or CD definition in the</text>
<text class="w" x="347.0" y="174.0">repository</text>
<text class="ho" x="347.0" y="195.0"><tspan class="k">HOLDS</tspan>  its file, the events that start it</text>
<line x1="347.0" y1="241.0" x2="550.0" y2="241.0" stroke="#e2e8f0"/>
<circle cx="354.0" cy="251.5" r="4.5" fill="#16a34a"/>
<text class="f" x="365.0" y="255.0">the delivered kit-ci.yml</text>
<rect x="335.0" y="103.0" width="227.0" height="172.0" rx="9" fill="none" stroke="#be123c" stroke-width="1.5"/>
<clipPath id="c3"><rect x="638.0" y="103.0" width="227.0" height="172.0" rx="9"/></clipPath>
<rect x="638.0" y="103.0" width="227.0" height="172.0" rx="9" fill="#ffffff"/>
<rect x="638.0" y="103.0" width="227.0" height="30" fill="#ffe4e6" clip-path="url(#c3)"/>
<line x1="638.0" y1="133.0" x2="865.0" y2="133.0" stroke="#be123c" stroke-opacity=".35"/>
<text class="h" x="650.0" y="123.5" style="fill:#881337">Run</text>
<text class="w" x="650.0" y="157.0">one execution of a pipeline</text>
<text class="ho" x="650.0" y="178.0"><tspan class="k">HOLDS</tspan>  pipeline, commit, change,</text>
<text class="ho" x="650.0" y="194.0">actor, status, its jobs, its logs, its</text>
<text class="ho" x="650.0" y="210.0">identity</text>
<line x1="650.0" y1="241.0" x2="853.0" y2="241.0" stroke="#e2e8f0"/>
<circle cx="657.0" cy="251.5" r="4.5" fill="#16a34a"/>
<text class="f" x="668.0" y="255.0">kit flow builds</text>
<rect x="638.0" y="103.0" width="227.0" height="172.0" rx="9" fill="none" stroke="#be123c" stroke-width="1.5"/>
<clipPath id="c4"><rect x="941.0" y="103.0" width="227.0" height="172.0" rx="9"/></clipPath>
<rect x="941.0" y="103.0" width="227.0" height="172.0" rx="9" fill="#ffffff"/>
<rect x="941.0" y="103.0" width="227.0" height="30" fill="#ffe4e6" clip-path="url(#c4)"/>
<line x1="941.0" y1="133.0" x2="1168.0" y2="133.0" stroke="#be123c" stroke-opacity=".35"/>
<text class="h" x="953.0" y="123.5" style="fill:#881337">Check</text>
<text class="w" x="953.0" y="157.0">a named result reported on a</text>
<text class="w" x="953.0" y="174.0">commit or change</text>
<text class="ho" x="953.0" y="195.0"><tspan class="k">HOLDS</tspan>  name, status, the run that</text>
<text class="ho" x="953.0" y="211.0">reported it</text>
<line x1="953.0" y1="227.0" x2="1156.0" y2="227.0" stroke="#e2e8f0"/>
<circle cx="960.0" cy="237.5" r="4.5" fill="#16a34a"/>
<text class="f" x="971.0" y="241.0">forge seam checks · kit</text>
<text class="f" x="971.0" y="255.0">ci's four</text>
<rect x="941.0" y="103.0" width="227.0" height="172.0" rx="9" fill="none" stroke="#be123c" stroke-width="1.5"/>
