<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1177" width="1200" height="1177" role="img" aria-labelledby="title desc">
  <title id="title">Delivery</title>
  <desc id="desc">Entities of the Delivery domain: Gate, Pipeline, Run, Check, Release, Artifact, Artifact store, Environment, Deployment, Target, and Fleet, from a pipeline's run to a deployment's target.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
    text { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #0f172a; }
    .title { font-size: 24px; font-weight: 700; }
    .intro { font-size: 13.5px; fill: #475569; }
    .h { font-size: 15px; font-weight: 700; }
    .w { font-size: 12.5px; fill: #1e293b; }
    .k { font-size: 11px; font-weight: 700; fill: #64748b; letter-spacing: .06em; }
    .ho { font-size: 12px; fill: #475569; }
    .m { font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 11.5px; fill: #334155; }
    .f { font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 11px; fill: #334155; }
    .lbl { font-size: 11.5px; fill: #475569; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
    .sec { font-size: 12px; font-weight: 700; fill: #475569; letter-spacing: .07em; }
    .edge { stroke: #475569; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .dash { stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="1176" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="32" y="22" width="6" height="28" rx="3" fill="#be123c"/>
  <text class="title" x="50" y="45" style="fill:#881337">Delivery</text>
  <text class="intro" x="32" y="72">What is built, released, and run. A run builds an artifact, named by its digest; a deployment puts that digest in an environment, so a running target traces back to its commit.</text>
  <g transform="translate(898,30)"><circle cx="5" cy="0" r="4.5" fill="#16a34a"/><text class="ho" x="16" y="3.5" style="font-size:11.5px">in kit today</text><circle cx="112" cy="0" r="4" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><text class="ho" x="123" y="3.5" style="font-size:11.5px">not modelled yet</text></g>
  <rect x="32.0" y="1011.0" width="1136.0" height="134.0" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="sec" x="48.0" y="1035.0">RULES</text>
<clipPath id="c1"><rect x="32.0" y="103.0" width="227.0" height="172.0" rx="9"/></clipPath>
<rect x="32.0" y="103.0" width="227.0" height="172.0" rx="9" fill="#ffffff"/>
