<rect x="335.0" y="339.0" width="227.0" height="30" fill="#ffe4e6" clip-path="url(#c5)"/>
<line x1="335.0" y1="369.0" x2="562.0" y2="369.0" stroke="#be123c" stroke-opacity=".35"/>
<text class="h" x="347.0" y="359.5" style="fill:#881337">Release</text>
<text class="w" x="347.0" y="393.0">a version published from a tag</text>
<text class="ho" x="347.0" y="414.0"><tspan class="k">HOLDS</tspan>  tag, notes, artifacts</text>
<line x1="347.0" y1="449.0" x2="550.0" y2="449.0" stroke="#e2e8f0"/>
<circle cx="354.0" cy="459.5" r="4.5" fill="#16a34a"/>
<text class="f" x="365.0" y="463.0">kit release · kit flow</text>
<text class="f" x="365.0" y="477.0">releases</text>
<rect x="335.0" y="339.0" width="227.0" height="158.0" rx="9" fill="none" stroke="#be123c" stroke-width="1.5"/>
<clipPath id="c6"><rect x="638.0" y="339.0" width="227.0" height="158.0" rx="9"/></clipPath>
<rect x="638.0" y="339.0" width="227.0" height="158.0" rx="9" fill="#ffffff"/>
<rect x="638.0" y="339.0" width="227.0" height="30" fill="#ffe4e6" clip-path="url(#c6)"/>
<line x1="638.0" y1="369.0" x2="865.0" y2="369.0" stroke="#be123c" stroke-opacity=".35"/>
<text class="h" x="650.0" y="359.5" style="fill:#881337">Artifact</text>
<text class="w" x="650.0" y="393.0">an output of a run, named by its</text>
<text class="w" x="650.0" y="410.0">digest</text>
<text class="ho" x="650.0" y="431.0"><tspan class="k">HOLDS</tspan>  digest, name, media type, the</text>
<text class="ho" x="650.0" y="447.0">run that built it</text>
<line x1="650.0" y1="463.0" x2="853.0" y2="463.0" stroke="#e2e8f0"/>
<circle cx="657.0" cy="473.5" r="4.5" fill="#16a34a"/>
<text class="f" x="668.0" y="477.0">the release tarball</text>
<rect x="638.0" y="339.0" width="227.0" height="158.0" rx="9" fill="none" stroke="#be123c" stroke-width="1.5"/>
<clipPath id="c7"><rect x="941.0" y="339.0" width="227.0" height="158.0" rx="9"/></clipPath>
<rect x="941.0" y="339.0" width="227.0" height="158.0" rx="9" fill="#ffffff"/>
<rect x="941.0" y="339.0" width="227.0" height="30" fill="#ffe4e6" clip-path="url(#c7)"/>
<line x1="941.0" y1="369.0" x2="1168.0" y2="369.0" stroke="#be123c" stroke-opacity=".35"/>
<text class="h" x="953.0" y="359.5" style="fill:#881337">Artifact store</text>
<text class="w" x="953.0" y="393.0">where artifacts are kept</text>
<text class="ho" x="953.0" y="414.0"><tspan class="k">HOLDS</tspan>  service, location, retention</text>
<line x1="953.0" y1="463.0" x2="1156.0" y2="463.0" stroke="#e2e8f0"/>
<circle cx="960.0" cy="473.5" r="4.5" fill="#16a34a"/>
<text class="f" x="971.0" y="477.0">GitHub release assets</text>
<rect x="941.0" y="339.0" width="227.0" height="158.0" rx="9" fill="none" stroke="#be123c" stroke-width="1.5"/>
<clipPath id="c8"><rect x="32.0" y="561.0" width="227.0" height="192.0" rx="9"/></clipPath>
<rect x="32.0" y="561.0" width="227.0" height="192.0" rx="9" fill="#ffffff"/>
<rect x="32.0" y="561.0" width="227.0" height="30" fill="#f8fafc" clip-path="url(#c8)"/>
<line x1="32.0" y1="591.0" x2="259.0" y2="591.0" stroke="#be123c" stroke-opacity=".35"/>
<text class="h" x="44.0" y="581.5" style="fill:#881337">Target</text>
<text class="w" x="44.0" y="615.0">one concrete place an</text>
<text class="w" x="44.0" y="632.0">environment runs on: a cluster's</text>
<text class="w" x="44.0" y="649.0">namespace, a host, a function, a</text>
<text class="w" x="44.0" y="666.0">store listing</text>
<text class="ho" x="44.0" y="687.0"><tspan class="k">HOLDS</tspan>  environment, address, what</text>
<text class="ho" x="44.0" y="703.0">it runs now</text>
<line x1="44.0" y1="719.0" x2="247.0" y2="719.0" stroke="#e2e8f0"/>
<circle cx="51.0" cy="729.5" r="4" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
<text class="f" x="62.0" y="733.0">not modelled</text>
<rect x="32.0" y="561.0" width="227.0" height="192.0" rx="9" fill="none" stroke="#be123c" stroke-width="1.5" stroke-dasharray="6 4"/>
<clipPath id="c9"><rect x="335.0" y="561.0" width="227.0" height="192.0" rx="9"/></clipPath>
<rect x="335.0" y="561.0" width="227.0" height="192.0" rx="9" fill="#ffffff"/>
<rect x="335.0" y="561.0" width="227.0" height="30" fill="#f8fafc" clip-path="url(#c9)"/>
<line x1="335.0" y1="591.0" x2="562.0" y2="591.0" stroke="#be123c" stroke-opacity=".35"/>
<text class="h" x="347.0" y="581.5" style="fill:#881337">Environment</text>
<text class="w" x="347.0" y="615.0">a named place software is</text>
<text class="w" x="347.0" y="632.0">deployed to: development, staging,</text>
<text class="w" x="347.0" y="649.0">production</text>
<text class="ho" x="347.0" y="670.0"><tspan class="k">HOLDS</tspan>  name, its protection:</text>
<text class="ho" x="347.0" y="686.0">required checks, approvers,</text>
<text class="ho" x="347.0" y="702.0">branch limits</text>
<line x1="347.0" y1="719.0" x2="550.0" y2="719.0" stroke="#e2e8f0"/>
<circle cx="354.0" cy="729.5" r="4" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
<text class="f" x="365.0" y="733.0">not modelled</text>
<rect x="335.0" y="561.0" width="227.0" height="192.0" rx="9" fill="none" stroke="#be123c" stroke-width="1.5" stroke-dasharray="6 4"/>
<clipPath id="c10"><rect x="638.0" y="561.0" width="227.0" height="192.0" rx="9"/></clipPath>
<rect x="638.0" y="561.0" width="227.0" height="192.0" rx="9" fill="#ffffff"/>
<rect x="638.0" y="561.0" width="227.0" height="30" fill="#f8fafc" clip-path="url(#c10)"/>
<line x1="638.0" y1="591.0" x2="865.0" y2="591.0" stroke="#be123c" stroke-opacity=".35"/>
<text class="h" x="650.0" y="581.5" style="fill:#881337">Deployment</text>
<text class="w" x="650.0" y="615.0">an artifact deployed to an</text>
<text class="w" x="650.0" y="632.0">environment</text>
<text class="ho" x="650.0" y="653.0"><tspan class="k">HOLDS</tspan>  artifact digest, environment,</text>
<text class="ho" x="650.0" y="669.0">run, actor, time, status</text>
<line x1="650.0" y1="719.0" x2="853.0" y2="719.0" stroke="#e2e8f0"/>
<circle cx="657.0" cy="729.5" r="4" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
<text class="f" x="668.0" y="733.0">not modelled</text>
<rect x="638.0" y="561.0" width="227.0" height="192.0" rx="9" fill="none" stroke="#be123c" stroke-width="1.5" stroke-dasharray="6 4"/>
<clipPath id="c11"><rect x="335.0" y="817.0" width="227.0" height="158.0" rx="9"/></clipPath>
<rect x="335.0" y="817.0" width="227.0" height="158.0" rx="9" fill="#ffffff"/>
<rect x="335.0" y="817.0" width="227.0" height="30" fill="#f8fafc" clip-path="url(#c11)"/>
<line x1="335.0" y1="847.0" x2="562.0" y2="847.0" stroke="#be123c" stroke-opacity=".35"/>
<text class="h" x="347.0" y="837.5" style="fill:#881337">Fleet</text>
<text class="w" x="347.0" y="871.0">the targets of one environment</text>
<text class="w" x="347.0" y="888.0">taken together</text>
<text class="ho" x="347.0" y="909.0"><tspan class="k">HOLDS</tspan>  environment, targets, the</text>
<text class="ho" x="347.0" y="925.0">version each runs</text>
<line x1="347.0" y1="941.0" x2="550.0" y2="941.0" stroke="#e2e8f0"/>
<circle cx="354.0" cy="951.5" r="4" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
<text class="f" x="365.0" y="955.0">not modelled</text>
<rect x="335.0" y="817.0" width="227.0" height="158.0" rx="9" fill="none" stroke="#be123c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <circle cx="54" cy="1055.0" r="2.2" fill="#be123c"/>
  <text class="w" x="66" y="1059.0">An artifact is identified by its digest, never by its name or tag, because a tag can move.</text>
  <circle cx="54" cy="1077.0" r="2.2" fill="#be123c"/>
  <text class="w" x="66" y="1081.0">A deployment names the artifact's digest, so the chain from a running target back to its commit holds.</text>
  <circle cx="54" cy="1099.0" r="2.2" fill="#be123c"/>
  <text class="w" x="66" y="1103.0">A fleet makes drift visible: the targets of one environment running different versions.</text>
  <circle cx="54" cy="1121.0" r="2.2" fill="#be123c"/>
  <text class="w" x="66" y="1125.0">kit reads environments and deployments from the service filling cd, or from a command provider over an organization's own deployment tool.</text>
  <path class="edge" d="M 259.0 118.0 H 335.0"/>
  <text class="lbl" text-anchor="middle" x="297.0" y="111.0">run by</text>
  <path class="edge" d="M 562.0 118.0 H 638.0"/>
  <text class="lbl" text-anchor="middle" x="600.0" y="111.0">runs as</text>
  <path class="edge" d="M 865.0 118.0 H 941.0"/>
  <text class="lbl" text-anchor="middle" x="903.0" y="111.0">reports</text>
  <path class="edge" d="M 751.5 275.0 V 339.0"/>
  <text class="lbl" x="759.5" y="311.0">builds</text>
  <path class="edge" d="M 562.0 354.0 H 638.0"/>
