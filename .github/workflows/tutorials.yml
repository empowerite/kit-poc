# tutorials.yml - builds one copy of the tutorials site and publishes it as a directory of the gh-pages branch
# ----------------------------------------------------------------------------------------------------------------------
# A push to main, or of a release tag, runs this workflow. GitHub Pages serves the gh-pages branch, and each copy of
# the site is one directory of it:
#
#   main                  publishes tutorials/main/, the copy a checkout's kit opens.
#   release/0.1.0         publishes tutorials/0.1/, its line's copy, which every 0.1.x release opens.
#   release/0.1.0-rc.8    publishes tutorials/0.1.0-rc.8/, the pre-release's own copy, never its line's.
#
# It has two jobs, and each step that is the repository's own is one command, so the same thing can be read at a desk:
#
#   bin/tutorials site      says which copy the ref builds: its line, its directory, and the base path it is served
#                           at. The address is the one kit opens, written once, in kit/modules/bash/tutorials.sh.
#   npm run build           builds that copy, and fails on an empty page or a dead link. The build runs npm's
#                           packages, so its job has a token that only reads.
#   bin/tutorials publish   replaces the copy's directory on gh-pages in one commit, and pushes it. Its job alone
#                           writes, and runs none of npm's packages: it is handed the build as an artifact.
#
# A newer push to the same ref replaces an older run. Two refs at once both land, since bin/tutorials publish tries a
# refused push again, on the branch as it then stands. The site is published here and nowhere else: bin/tutorials
# publish refuses to run anywhere but on the runner. A pre-release's copy is removed with its tag; see
# retire-pre-releases.yml.
#
# see: bin/tutorials, projects/tutorials/README.md

name: tutorials

on:
  push:
    branches: [main]
    tags: ['release/*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tutorials-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      directory: ${{ steps.site.outputs.directory }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # kit runs nothing in a clone until it is trusted, and a runner has no one to ask, so the job trusts the checkout
      # it made, with the checkout's own kit.
      - name: trust
        run: kit/bin/kit trust --yes "${GITHUB_WORKSPACE}"

      # The kit toolchain installs under ~/.kit/tools/, kept between runs while tools.lock is as it was.
      - name: kit-tools-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.kit/tools
          key: kit-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools.lock') }}

      # The pinned tools, through the kit toolchain, for node.
      - name: tools
        run: |
          set -o errexit -o nounset -o pipefail
          kit/bin/kit tools install --toolchain kit
          kit/bin/kit tools path --toolchain kit >> "${GITHUB_PATH}"

      - name: site
        id: site
        run: bin/tutorials site "${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"

      - name: build
        working-directory: projects/tutorials
        env:
          TUTORIALS_BASE: ${{ steps.site.outputs.base }}
          TUTORIALS_LINE: ${{ steps.site.outputs.line }}
        run: |
          set -o errexit -o nounset -o pipefail
          npm ci --no-audit --no-fund
          npm run build

      - name: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: site
          path: projects/tutorials/dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: site
          path: ${{ runner.temp }}/site

      # git pushes the branch, with the credentials gh gives it for this job's token; both are on GitHub's runners.
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          DIRECTORY: ${{ needs.build.outputs.directory }}
        run: bin/tutorials publish "${DIRECTORY}" "${RUNNER_TEMP}/site"

# ----------------------------------------------------------------------------------------------------------------------
