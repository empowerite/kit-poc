# retire-pre-releases.yml - deleting a branch deletes the pre-releases that were made from it
# ----------------------------------------------------------------------------------------------------------------------
# Deleting a branch on GitHub runs this workflow. It has two steps, and each is one command of the repository's own:
# bin/release retire deletes every pre-release, tag included, whose commit is no longer on any branch, and then
# bin/tutorials retire removes, from the gh-pages branch, the copy of the tutorials of each pre-release whose tag is
# gone. A release is never deleted, because it is on main and main is never deleted, and a pre-release tagged on main
# stays for the same reason; a release's tutorials stay with it. Deleting a tag also sends a delete event, and that
# one is ignored.
#
# see: bin/release, bin/tutorials, .github/workflows/release.yml, .github/workflows/tutorials.yml

name: retire-pre-releases

on:
  delete:

permissions:
  contents: write

jobs:
  retire:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # bin/release enters the checkout as every kit verb does, and kit runs nothing in a clone until it is trusted; a
      # runner has no one to ask, so the job trusts the checkout it made, with the checkout's own kit.
      - name: trust
        run: kit/bin/kit trust --clone --yes "${GITHUB_WORKSPACE}"

      - name: retire
        env:
          GH_TOKEN: ${{ github.token }}
        run: bin/release retire

      - name: retire-the-tutorials
        env:
          GH_TOKEN: ${{ github.token }}
        run: bin/tutorials retire

# ----------------------------------------------------------------------------------------------------------------------
