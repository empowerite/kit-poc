# One trailer of a message's last paragraph, as git interpret-trailers --parse reads it. git stores only the message's
# text, so every part of a trailer is read from it.
entity: GitTrailer
layer: native
tool: git
means: A token and a value at the end of a message, such as Signed-off-by or Co-Authored-By.
fields:
  token:
    type: Text
    source: derived
    from: the trailer line up to its separator, of ASCII letters, digits, and hyphens
    status: held
    read-by: facts commits.*.trailers.*.key
    means: The trailer's name.
  separator:
    type: Text
    source: derived
    from: the first character after the token and any spaces or tabs, a colon or a character trailer.separators names
    status: unused
    means: The character that ends the token, which spaces or tabs may precede.
  value:
    type: Text
    source: derived
    from: the trailer line after its separator, with any continuation lines that start with a space or a tab
    status: held
    read-by: facts commits.*.trailers.*.value
    means: What the trailer says, its continuation lines unfolded into one.
relations:
  message:
    to: GitMessage
    inverse: GitMessage.trailers
    means: The message whose last paragraph holds this trailer.
