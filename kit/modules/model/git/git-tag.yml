# An annotated tag object: object, type, tag, and tagger headers, then the message, then a signature when it is signed.
# A lightweight tag is a ref alone and has no object, so it is not one of these.
entity: GitTag
layer: native
tool: git
means: A named, dated pointer to one object, with a message and, when signed, a signature.
fields:
  id:
    type: Hash
    source: derived
    from: the hash of "tag <size>", a NUL byte, and the content, in the repository's object format, SHA-1 or SHA-256
    status: unused
    means: The object's name.
  size:
    type: Int
    source: derived
    from: the length of the headers, the message, and the signature in bytes, as git cat-file -s prints it
    status: unused
    means: The length of the tag object's content in bytes.
  type:
    type: {enum: [blob, tree, commit, tag]}
    source: stored
    status: unused
    means: The type header, the kind of object the object header names.
  name:
    type: Text
    source: stored
    status: unused
    means: The tag header, the name given when the tag was made, which the ref that points at the tag need not match.
  extra-headers:
    type: Text
    arity: many
    source: stored
    status: unused
    means: Each header git does not know, as its name, a space, and its value, which git fsck accepts, in order.
relations:
  target:
    to: GitObject
    inverse: GitObject.tagged-by
    means: The object header, the object this tag points at.
  tagger:
    to: GitSignature
    arity: option
    inverse: GitSignature.tagged
    means: The tagger header, who made the tag and when, which only tags made by the earliest versions of git lack.
  message:
    to: GitMessage
    inverse: GitMessage.tag
    means: Everything after the blank line that ends the headers, up to the signature.
  signature:
    to: GitObjectSignature
    arity: option
    inverse: GitObjectSignature.tag
    means: The signature at the end of the tag's body, over the tag in the repository's object format.
  compat-signature:
    to: GitObjectSignature
    arity: option
    inverse: GitObjectSignature.compat-tag
    means: >-
      The signature over the tag in the other object format, in a gpgsig-sha256 header in a SHA-1 repository and a
      gpgsig header in a SHA-256 one.
  merged-by:
    to: GitCommit
    arity: many
    inverse: GitCommit.mergetags
    means: The merge commits that embed this tag in a mergetag header.
  tagged-by:
    to: GitTag
    arity: many
    derived: the annotated tags whose target is Tag(this)
    means: The annotated tags whose object header names this tag.
