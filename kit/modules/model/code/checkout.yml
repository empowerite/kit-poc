# A checkout is a clone on this machine: one git directory with its main worktree, the desk, and any linked
# worktrees. Kit finds checkouts under the workspace file's roots, and a checkout belongs to the repository its
# primary remote names.
entity: Checkout
layer: logical
over: [GitDir]
means: A clone of a repository on this machine, whose main worktree is the desk.
fields:
  path:
    type: Path
    source: derived
    from: GitDir.checkout
    status: held
    read-by: workspace repos checkouts.*
    means: The folder of the clone, the top of its main worktree, or for a bare clone its git directory, GitDir.path.
  bare:
    type: Bool
    source: derived
    from: GitDir.bare
    status: unused
    means: >-
      Whether the clone has no working tree of its own, so its main worktree is its git directory, which kit does
      not print.
relations:
  repository:
    to: Repository
    arity: option
    inverse: Repository.checkouts
    means: The repository its primary remote's URL names, none for a clone whose primary remote names no host.
  worktrees:
    to: Worktree
    arity: some
    ordered: true
    inverse: Worktree.checkout
    means: >-
      Its worktrees, the main one first, then the linked ones in the order git worktree list gives them. A bare
      clone's main worktree is its git directory.
  main:
    to: Worktree
    derived: the worktree among worktrees whose kind is desk
    means: >-
      The main worktree, the desk, which for a bare clone is its git directory, the first that git worktree list
      gives.
  linked:
    to: Worktree
    arity: many
    derived: the worktrees among worktrees whose kind is linked
    means: The worktrees git worktree add made, which kit work makes one per issue.
  remotes:
    to: Remote
    arity: many
    ordered: true
    inverse: Remote.checkout
    means: The remotes its configuration defines, the primary first, then the rest in the order git remote gives them.
  branches:
    to: Branch
    arity: many
    inverse: Branch.checkout
    means: Its local branches and its remote-tracking branches.
  tags:
    to: Tag
    arity: many
    inverse: Tag.checkout
    means: Its tags.
