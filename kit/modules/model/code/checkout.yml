# A checkout is a clone on this machine: one git directory with its main worktree, the desk, and any linked
# worktrees. Kit finds checkouts under the workspace file's roots, and a checkout belongs to the repository its
# primary remote names.
entity: Checkout
layer: logical
over: [GitDir]
means: A clone of a repository on this machine, whose main worktree is the desk.
fields:
  path:
    type: Path
    source: derived
    from: GitDir.checkout
    status: held
    read-by: workspace repos checkouts.*
    means: The folder of the clone, the top of its main worktree.
  bare:
    type: Bool
    source: derived
    from: GitDir.bare
    status: unused
    means: Whether the clone has no main worktree, which kit does not print.
relations:
  repository:
    to: Repository
    arity: option
    inverse: Repository.checkouts
    means: The repository its primary remote's URL names, none for a clone whose primary remote names no host.
  worktrees:
    to: Worktree
    arity: many
    inverse: Worktree.checkout
    means: Its worktrees, the main one first, none for a bare clone that has no linked worktree.
  main:
    to: Worktree
    arity: option
    derived: the worktree among worktrees whose kind is desk
    means: The main worktree, the desk, which a bare clone does not have.
  linked:
    to: Worktree
    arity: many
    derived: the worktrees among worktrees whose kind is linked
    means: The worktrees git worktree add made, which kit work makes one per issue.
  remotes:
    to: Remote
    arity: many
    inverse: Remote.checkout
    means: The remotes its configuration defines, the primary first.
  branches:
    to: Branch
    arity: many
    inverse: Branch.checkout
    means: Its local branches and its remote-tracking branches.
  tags:
    to: Tag
    arity: many
    inverse: Tag.checkout
    means: Its tags.
