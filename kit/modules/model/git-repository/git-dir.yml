# The common git directory, as gitrepository-layout lays it out: the .git directory of a checkout, the directory of a
# bare repository, or a submodule's under its superproject's modules/<name>/. It holds what every worktree shares:
# the objects, the shared refs, packed-refs, the configuration, the hooks, info/, shallow, the alternates, modules/,
# and worktrees/. For the main worktree it is also that worktree's own git directory, GitWorktreeDir, which holds its
# HEAD, index, logs/HEAD, and root refs, as worktrees/<id>/ is a linked worktree's. A bare repository has one
# GitWorktreeDir, this directory, with a HEAD and no working tree.
entity: GitDir
layer: native
tool: git
means: A repository's git directory, which holds its objects, refs, configuration, hooks, and worktrees.
fields:
  path:
    type: Path
    source: derived
    from: git rev-parse --path-format=absolute --git-common-dir
    status: unused
    means: Where the directory is.
  bare:
    type: Bool
    source: stored
    status: unused
    means: The value of core.bare, whether the repository has no main worktree.
  format-version:
    type: {enum: ["0", "1"]}
    source: stored
    status: unused
    means: The value of core.repositoryformatversion, 1 when the config's extensions section is in force.
  object-format:
    type: {enum: [sha1, sha256]}
    source: stored
    status: unused
    means: The value of extensions.objectFormat, the hash that names objects, sha1 when unset.
  ref-format:
    type: {enum: [files, reftable]}
    source: stored
    status: unused
    means: >-
      The value of extensions.refStorage, files for loose refs under refs/ and the packed-refs file, or reftable for
      the tables under reftable/, files when unset.
  packed-refs-traits:
    type: Text
    arity: many
    source: stored
    status: unused
    means: The traits the header of packed-refs names, as peeled, fully-peeled, and sorted.
  shallow:
    type: Hash
    arity: many
    source: stored
    status: unused
    means: The ids in the shallow file, the commits of a shallow clone whose parents are not here.
  grafts:
    type: Text
    arity: many
    source: stored
    status: unused
    means: >-
      The lines of info/grafts, each a commit's id and the ids git takes as its parents, which git replace supersedes.
  alternates:
    type: Path
    arity: many
    source: stored
    status: unused
    means: The lines of objects/info/alternates, the object stores this one borrows objects from.
  http-alternates:
    type: Url
    arity: many
    source: stored
    status: unused
    means: The lines of objects/info/http-alternates, the object stores a fetch over HTTP borrows from.
  packs:
    type: Text
    arity: many
    source: stored
    status: unused
    means: The lines of objects/info/packs, which git update-server-info writes for dumb transports.
  info-refs:
    type: Text
    arity: many
    source: stored
    status: unused
    means: The lines of info/refs, each a ref's id and name, which git update-server-info writes for dumb transports.
  exclude:
    type: Text
    arity: many
    source: stored
    status: unused
    means: The lines of info/exclude, ignore patterns of this repository alone, as gitignore reads them.
  attributes:
    type: Text
    arity: many
    source: stored
    status: unused
    means: The lines of info/attributes, attributes of this repository alone, as gitattributes reads them.
  hooks:
    type: Path
    arity: many
    source: stored
    status: unused
    means: The hook programs under hooks/, or under the directory core.hooksPath names, a sample one ending in .sample.
  description:
    type: Text
    arity: option
    source: stored
    status: unused
    means: The description file, which gitweb shows and git init fills with a placeholder.
  legacy-remotes:
    type: Path
    arity: many
    source: stored
    status: unused
    means: >-
      The files under remotes/ and branches/, an older way to name a remote, which git reads as it reads a remote's
      configuration.
relations:
  worktree-dirs:
    to: GitWorktreeDir
    arity: some
    inverse: GitWorktreeDir.common
    means: >-
      The git directories of the repository's worktrees: this directory itself for the main worktree, or for a bare
      repository's HEAD, and worktrees/<id>/ for each linked worktree.
  refs:
    to: GitRef
    arity: many
    inverse: GitRef.dir
    means: >-
      Every ref of the repository: the shared ones under refs/ here, and each worktree's own, under refs/bisect/,
      refs/worktree/, and refs/rewritten/ of its git directory.
  config:
    to: GitConfigEntry
    arity: many
    ordered: true
    inverse: GitConfigEntry.dirs
    means: >-
      The entries of the system, global, and local scopes that apply to the repository, with the files they include,
      in the order git reads them.
  remotes:
    to: GitRemoteConfig
    arity: many
    inverse: GitRemoteConfig.dir
    means: The remotes the repository's configuration defines.
  branch-configs:
    to: GitBranchConfig
    arity: many
    inverse: GitBranchConfig.dir
    means: The branch.<name> sections of the repository's configuration, one a branch.
  user:
    to: GitUserConfig
    inverse: GitUserConfig.dir
    means: Who git writes as the author and committer in this repository, and how it signs.
  submodules:
    to: GitSubmodule
    arity: many
    inverse: GitSubmodule.superproject
    means: The submodules the repository's .gitmodules and config name.
  module:
    to: GitSubmodule
    arity: option
    inverse: GitSubmodule.git-dir
    means: >-
      The submodule whose git directory this is, under its superproject's modules/<name>/ or inside the submodule's
      checkout.
