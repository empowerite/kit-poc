# modelled.
entity: Service
stub: true
means: >-
  One system kit talks to, such as github.com, a self-hosted GitLab, or an Azure DevOps organization, which holds its
  projects.
relations:
  organizations:
    to: Organization
    arity: many
    inverse: Organization.service
