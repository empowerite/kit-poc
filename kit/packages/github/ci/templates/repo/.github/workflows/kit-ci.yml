# kit-ci.yml - the check the kit delivers for GitHub Actions: kit ci on every pull request into the default branch
# ----------------------------------------------------------------------------------------------------------------------
# Runs one job, CI, on each pull request into the default branch. CI is the check name a ruleset requires. The job:
#
#   1. puts the toolchain the ci_toolchain answer names on the runner: mise, nix, or the devcontainer CLI (brew and
#      docker are already on GitHub's runners, kit is kit itself, and ambient needs nothing), and for kit, restores
#      ~/.kit/tools from the cache when kit.lock is as it was
#   2. puts kit on PATH: the release the target branch's kit.yml declares, downloaded from its GitHub release and
#      unpacked only when its bytes have the digest published beside it, or the checkout's own kit/bin/ when it
#      declares unreleased
#   3. runs `kit ci`: `kit linked` and `kit policy`, then the change's tools are installed (`kit tools install`, through
#      that toolchain: KIT_TOOLCHAIN names it), then the gate and `kit check`; it reports every result
#
# Nothing of the change's is installed or put on PATH before the two judgements, so no step here runs `kit tools`:
# `kit ci` does, after them.
#
# When a pull request closes, a second job, Settle, runs `kit settle` on it, from the base's workflow and checkout: an
# issue in another tracker that a merged pull request's body closes is closed, and the issues of one closed without
# merging are backlog again. It alone may write to issues. It reads the other trackers with the repository's secrets: AZURE_DEVOPS_EXT_PAT for Azure DevOps.
#
# Added by kit's github/ci package. To remove it, run kit packages remove github/ci.
# To change it, do not edit it here: see "Changing what kit adds" in .kit/1st.md.
# runs-on is the ci_runner value under answers: in kit.yml; timeout-minutes is its ci_timeout_minutes value;
# KIT_TOOLCHAIN is its ci_toolchain value.
#
# see: .kit/1st.md

name: kit

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  # Settle writes to issues, which a fork's or Dependabot's pull_request token cannot. This event runs the base's workflow
  # with the base's checkout, and Settle runs none of the change's code.
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  CI:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: "@ci_runner@"
    # A hung step fails the job after this many minutes, not after GitHub's six hours. fromJSON makes the answer a
    # number, and keeps the template YAML, where a value cannot start with @.
    timeout-minutes: ${{ fromJSON('@ci_timeout_minutes@') }}
    # One run for a pull request at a time: a push and an edit of its body, which kit commit makes, come close together,
    # and the newer run sees both. Settle is in no group, so no run of this job cancels it.
    concurrency:
      group: kit-ci-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      # mise also reads mise.ci.toml, on top of mise.toml, for the tools only a runner needs.
      MISE_ENV: ci
      # The toolchain the project uses on this runner; kit refuses a named toolchain it cannot use.
      KIT_TOOLCHAIN: "@ci_toolchain@"
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # kit policy reads every commit since the branch forked from the default branch.
          fetch-depth: 0

      - name: mise-on-path
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        if: ${{ env.KIT_TOOLCHAIN == 'mise' }}
        with:
          install: false

      - name: nix-on-path
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa  # v23
        if: ${{ env.KIT_TOOLCHAIN == 'nix' }}

      - name: devcontainer-on-path
        if: ${{ env.KIT_TOOLCHAIN == 'devcontainer' }}
        run: |
          set -o errexit -o nounset -o pipefail
          npm install --global @devcontainers/cli@0.90.0

      # The release is the one the target branch's kit.yml declares, never the change's: a change cannot choose the kit
      # that judges it. unreleased is the checkout's own kit, which is for a repository of the kit itself. The first
      # change of a repository, whose target has no kit.yml, declares its own.
      - name: kit-on-path
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -o errexit -o nounset -o pipefail
          declared=$(git show "${BASE_SHA}:kit.yml" 2>/dev/null || cat kit.yml 2>/dev/null || true)
          version=$(sed -n 's/^version: *//p' <<<"${declared}" | sed "s/[[:space:]]*#.*//; s/^[\"']//; s/[\"']$//")
          if [[ -z "${version}" ]]
          then
            echo '::error::run kit install and commit what it writes; kit.yml declares no kit version'
            exit 1
          fi
          if [[ "${version}" == unreleased && -x kit/bin/kit ]]
          then
            printf '%s/kit/bin\n' "${PWD}" >> "${GITHUB_PATH}"
          elif [[ "${version}" == unreleased ]]
          then
            echo '::error::kit.yml declares unreleased and there is no kit/bin/kit; pin a release and run kit update'
            exit 1
          elif ! command -v kit >/dev/null
          then
            tarball="https://github.com/empowerite/kit-poc/releases/download/release/${version}/kit-${version}.tar.gz"
            curl --fail --silent --location --output "${RUNNER_TEMP}/kit-${version}.tar.gz" "${tarball}"
            curl --fail --silent --location --output "${RUNNER_TEMP}/kit-${version}.tar.gz.sha256" "${tarball}.sha256"
            # Nothing from the tarball runs until its bytes have the digest the release publishes beside it.
            if ! (cd "${RUNNER_TEMP}" && shasum --algorithm 256 --check --status "kit-${version}.tar.gz.sha256")
            then
              echo "::error::kit-${version}.tar.gz does not have the digest its release publishes; it is not unpacked"
              exit 1
            fi
            mkdir -p "${RUNNER_TEMP}/kit"
            tar --extract --gzip --file "${RUNNER_TEMP}/kit-${version}.tar.gz" --directory "${RUNNER_TEMP}/kit" \
              --strip-components 1
            printf '%s/kit/bin\n' "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
          fi
          # kit chooses its release by the kit.yml it is run in, which is the change's; the base's is the one it takes.
          echo "KIT_VERSION=${version}" >> "${GITHUB_ENV}"

      # kit runs nothing in a clone until it is trusted, and a runner has no one to ask: the job trusts the checkout
      # it made, of the repository whose workflow this is.
      - name: trust
        run: kit trust --clone --yes "${GITHUB_WORKSPACE}"

      # The kit toolchain installs under ~/.kit/tools/, kept between runs while kit.lock is as it was.
      - name: kit-tools-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: ${{ env.KIT_TOOLCHAIN == 'kit' }}
        with:
          path: ~/.kit/tools
          key: kit-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('kit.lock') }}

      - name: kit-ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: kit ci

  Settle:
    if: github.event_name == 'pull_request_target'
    runs-on: "@ci_runner@"
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: kit-on-path
        run: |
          set -o errexit -o nounset -o pipefail
          version=$(sed -n 's/^version: *//p' kit.yml 2>/dev/null | sed "s/[[:space:]]*#.*//; s/^[\"']//; s/[\"']$//")
          if [[ -z "${version}" ]]
          then
            echo '::error::run kit install and commit what it writes; kit.yml declares no kit version'
            exit 1
          fi
          if [[ "${version}" == unreleased && -x kit/bin/kit ]]
          then
            printf '%s/kit/bin\n' "${PWD}" >> "${GITHUB_PATH}"
          elif [[ "${version}" == unreleased ]]
          then
            echo '::error::kit.yml declares unreleased and there is no kit/bin/kit; pin a release and run kit update'
            exit 1
          elif ! command -v kit >/dev/null
          then
            tarball="https://github.com/empowerite/kit-poc/releases/download/release/${version}/kit-${version}.tar.gz"
            curl --fail --silent --location --output "${RUNNER_TEMP}/kit-${version}.tar.gz" "${tarball}"
            curl --fail --silent --location --output "${RUNNER_TEMP}/kit-${version}.tar.gz.sha256" "${tarball}.sha256"
            # Nothing from the tarball runs until its bytes have the digest the release publishes beside it.
            if ! (cd "${RUNNER_TEMP}" && shasum --algorithm 256 --check --status "kit-${version}.tar.gz.sha256")
            then
              echo "::error::kit-${version}.tar.gz does not have the digest its release publishes; it is not unpacked"
              exit 1
            fi
            mkdir -p "${RUNNER_TEMP}/kit"
            tar --extract --gzip --file "${RUNNER_TEMP}/kit-${version}.tar.gz" --directory "${RUNNER_TEMP}/kit" \
              --strip-components 1
            printf '%s/kit/bin\n' "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
          fi

      # kit runs nothing in a clone until it is trusted, and a runner has no one to ask: the job trusts the checkout
      # it made, of the repository whose workflow this is.
      - name: trust
        run: kit trust --clone --yes "${GITHUB_WORKSPACE}"

      - name: kit-settle
        env:
          GH_TOKEN: ${{ github.token }}
          AZURE_DEVOPS_EXT_PAT: ${{ secrets.AZURE_DEVOPS_EXT_PAT }}
          PR: ${{ github.event.pull_request.number }}
        run: kit settle "${PR}"

# ----------------------------------------------------------------------------------------------------------------------
